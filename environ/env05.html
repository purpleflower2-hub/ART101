<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Inside the Stable</title>
    <link href="env03.css" rel="stylesheet" type="text/css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="env05.js" defer></script>
</head>

<body>

    <h1 id="welcome">Inside the Stable</h1>

    <h2>You hit your head a minute ago, are you okay?</h2>

    <div id="environment-output"></div>

    <button id="move-on">Yes</button>

    <button id="ask-question">Where am I?</button>

    <button id="explore" style="display: none;">Explore</button>

    <button id="open-shutters" style="display: none;">Open Shutters</button>

    <button id="inspect-horseshoe" style="display: none;">
    Inspect Horseshoe
</button>

<img id="horseshoe-closeup"
     src="horseshoe.png"
     alt="Close-up of a horseshoe"
     style="display: none;">

     
<!-- horseshoe choices -->

<button id="turn-horseshoe" style="display: none;">Turn It Over</button>

<button id="put-horseshoe-down" style="display: none;">Put Horseshoe Down</button>

<!-- hay choices -->

<button id="search-hay" style="display: none;">Search the Hay</button>

<button id="move-hay" style="display: none;">Move the Hay</button>

<button id="take-key" style="display: none;">Take Key</button>

<!-- final choices -->

<button id="stay-still" style="display: none;">Stay Still</button>

<button id="call-out" style="display: none;">Call Out</button>


</body>
</html>
